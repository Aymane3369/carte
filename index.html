<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Hub · Accès dossier</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #0b1a2e 0%, #1a2f3f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(66, 133, 244, 0.08) 0%, transparent 60%),
                        radial-gradient(circle at 70% 80%, rgba(251, 188, 4, 0.06) 0%, transparent 50%);
            animation: driftBackground 30s infinite alternate ease-in-out;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes driftBackground {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(4%, 3%) scale(1.05); }
        }

        .scene-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px) saturate(1.6);
            -webkit-backdrop-filter: blur(24px) saturate(1.6);
            border-radius: 40px;
            padding: 40px 35px 35px;
            max-width: 850px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .scene-card:hover {
            transform: translateY(-4px) scale(1.003);
        }

        .header-scene {
            text-align: center;
            margin-bottom: 32px;
            position: relative;
        }

        .icon-orbit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            border-radius: 30px;
            background: linear-gradient(135deg, #fbbc04, #f29900);
            box-shadow: 0 12px 40px rgba(251, 188, 4, 0.35), inset 0 -2px 0 rgba(0,0,0,0.1);
            font-size: 48px;
            color: #fff;
            margin-bottom: 16px;
            animation: floatIcon 4s infinite ease-in-out;
            transition: transform 0.3s;
        }

        .icon-orbit:hover {
            transform: scale(1.05) rotate(-4deg);
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .header-scene h1 {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.3px;
            text-shadow: 0 2px 20px rgba(0,0,0,0.3);
        }

        .header-scene .glow-text {
            display: inline-block;
            background: linear-gradient(90deg, #fbbc04, #ff6f00, #fbbc04);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmerText 5s linear infinite;
        }

        @keyframes shimmerText {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .sub-scene {
            color: rgba(255, 255, 255, 0.65);
            font-size: 15px;
            font-weight: 300;
            margin-top: 6px;
            letter-spacing: 0.3px;
        }

        .sub-scene span {
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .grid-scene {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 14px;
            margin: 28px 0 24px;
        }

        .item-scene {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(4px);
        }

        .item-scene::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 18px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent 60%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .item-scene:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
        }

        .item-scene:hover::before {
            opacity: 1;
        }

        .item-scene a {
            text-decoration: none;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            font-weight: 500;
            font-size: 15px;
            transition: color 0.3s;
        }

        .item-scene a:hover {
            color: #fbbc04;
        }

        /* ===== STYLE POUR LES AVATARS ===== */
        .item-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.05);
        }

        .item-scene:hover .item-avatar {
            border-color: #fbbc04;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(251, 188, 4, 0.3);
        }

        .item-icon-scene {
            font-size: 24px;
            flex-shrink: 0;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            transition: all 0.3s;
        }

        .item-scene:hover .item-icon-scene {
            background: rgba(251, 188, 4, 0.15);
            transform: scale(1.05) rotate(-6deg);
        }

        .item-name-scene {
            flex: 1;
            word-break: break-word;
            line-height: 1.3;
        }

        .badge-scene {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 3px 10px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            font-weight: 600;
        }

        .badge-scene.folder {
            background: rgba(66, 133, 244, 0.15);
            color: #8ab4f8;
            border-color: rgba(66, 133, 244, 0.15);
        }

        .badge-scene.file {
            background: rgba(251, 188, 4, 0.12);
            color: #fdd663;
            border-color: rgba(251, 188, 4, 0.12);
        }

        .badge-scene.tools {
            background: rgba(255, 107, 107, 0.15);
            color: #ff8a80;
            border-color: rgba(255, 107, 107, 0.15);
        }

        .badge-scene.map {
            background: rgba(76, 175, 80, 0.15);
            color: #81c784;
            border-color: rgba(76, 175, 80, 0.15);
        }

        /* ===== STYLE SPÉCIAL POUR SOUS-ÉLÉMENT ===== */
        .item-scene.sub-item {
            margin-left: 20px;
            border-left: 2px solid rgba(251, 188, 4, 0.3);
            border-radius: 18px 4px 4px 18px;
            background: rgba(255, 255, 255, 0.02);
            padding-left: 20px;
        }

        .item-scene.sub-item::before {
            content: '└─ ';
            position: absolute;
            left: -6px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(251, 188, 4, 0.2);
            font-size: 14px;
            font-weight: 100;
            letter-spacing: -1px;
        }

        .item-scene.sub-item .item-icon-scene {
            width: 30px;
            height: 30px;
            font-size: 18px;
            background: rgba(76, 175, 80, 0.08);
        }

        .item-scene.sub-item a {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        .item-scene.sub-item:hover {
            background: rgba(76, 175, 80, 0.06);
            border-color: rgba(76, 175, 80, 0.2);
        }

        .footer-scene {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding-top: 22px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            gap: 12px;
        }

        .btn-root {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 24px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.3s;
            backdrop-filter: blur(4px);
        }

        .btn-root:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }

        .btn-root .arrow {
            transition: transform 0.3s;
        }

        .btn-root:hover .arrow {
            transform: translateX(4px);
        }

        .footer-note-scene {
            color: rgba(255, 255, 255, 0.25);
            font-size: 12px;
            font-weight: 300;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .footer-note-scene .dot {
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #fbbc04;
            animation: pulseDot 2s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        @media (max-width: 600px) {
            .scene-card {
                padding: 28px 18px 24px;
                border-radius: 28px;
            }
            .header-scene h1 {
                font-size: 22px;
            }
            .grid-scene {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .item-scene {
                padding: 12px 12px;
            }
            .item-scene a {
                font-size: 13px;
                gap: 8px;
            }
            .item-avatar {
                width: 32px;
                height: 32px;
            }
            .item-icon-scene {
                width: 32px;
                height: 32px;
                font-size: 18px;
            }
            .item-scene.sub-item {
                margin-left: 10px;
                padding-left: 14px;
            }
            .footer-scene {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .btn-root {
                justify-content: center;
            }
            .footer-note-scene {
                justify-content: center;
            }
        }

        @media (max-width: 420px) {
            .grid-scene {
                grid-template-columns: 1fr;
            }
            .icon-orbit {
                width: 70px;
                height: 70px;
                font-size: 36px;
            }
            .item-scene.sub-item {
                margin-left: 6px;
                padding-left: 12px;
            }
        }
    </style>
</head>
